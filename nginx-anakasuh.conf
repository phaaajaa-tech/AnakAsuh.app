# Nginx reverse proxy untuk AnakAsuh
# =============================================================
# Cara pakai di aaPanel:
#   1. aaPanel > Website > Add Site > masukkan domain atau IP
#   2. Set "Site Directory" ke: /www/wwwroot/anakasuh
#   3. Set Proxy ke server block ini, atau replace config site di:
#      /www/server/panel/vhost/nginx/namadomain.conf
#   4. Reload nginx: nginx -s reload
#
# Saat domain belum ada, akses langsung via IP: http://IP-ANDA/
# Setelah domain aktif, ganti SERVER_NAME di bawah.
# =============================================================

upstream anakasuh_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    # listen 443 ssl http2;  # Uncomment setelah SSL aktif

    # GANTI dengan domain Anda saat sudah ada, misal: anakasuh.id
    # Untuk sekarang pakai IP atau _ (catch-all)
    server_name _;

    # SSL (Aktifkan setelah dapat domain + Let's Encrypt dari aaPanel)
    # ssl_certificate    /www/server/panel/vhost/cert/namadomain/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/namadomain/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # Redirect HTTP ke HTTPS — HAPUS/komentari saat belum ada SSL
    # if ($scheme = http) {
    #     return 301 https://$host$request_uri;
    # }

    root /www/wwwroot/anakasuh/public;
    index login.html;

    # File statis langsung dilayani Nginx (lebih cepat)
    location ~* \.(html|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy semua API dan route dinamis ke Node.js (PM2)
    location / {
        proxy_pass http://anakasuh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket support (jika dibutuhkan nanti)
    location /ws {
        proxy_pass http://anakasuh_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
