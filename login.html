<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | AnakAsuh</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#f4faf7;display:grid;place-items:center;padding:20px;color:#17352d}.card{width:min(440px,100%);background:#fff;border:1px solid #dcebe4;border-radius:24px;padding:30px;box-shadow:0 20px 60px #145c3a18}h1{margin:0 0 8px}.muted{color:#70817a;line-height:1.6}label{display:block;font-size:13px;font-weight:750;margin:18px 0 8px}.phone{display:flex;border:1px solid #d9e7e1;border-radius:13px;overflow:hidden}.prefix{padding:15px;background:#f2f8f5;font-weight:700}.phone input{border:0;outline:0;padding:0 14px;flex:1;font-size:16px}.otp{width:100%;height:54px;border:1px solid #d9e7e1;border-radius:13px;text-align:center;font-size:24px;letter-spacing:8px}button{width:100%;height:52px;border:0;border-radius:13px;margin-top:16px;background:#087253;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{margin-top:14px;padding:11px;border-radius:11px;display:none}.show{display:block}.ok{background:#ecfaf4;color:#087253}.err{background:#fff0ee;color:#b42318}.small{font-size:12px;text-align:center;margin-top:20px;color:#84928d}</style></head><body><main class="card"><h1>ANAKASUH</h1><p class="muted">Masuk dengan nomor WhatsApp dan kode OTP.</p><form id="f"><label>Nomor WhatsApp</label><div class="phone"><div class="prefix">+62</div><input id="phone" inputmode="numeric" placeholder="81234567890" required></div><button id="send">Kirim Kode OTP</button></form><section id="otpbox" style="display:none"><label>Kode OTP 6 digit</label><input id="otp" class="otp" maxlength="6" inputmode="numeric" placeholder="••••••"><button id="verify" type="button">Verifikasi & Masuk</button><button id="resend" type="button" disabled>Kirim ulang OTP (60)</button></section><div id="s" class="status"></div><div class="small">Public Beta • Developer: m.arfa</div></main><script>
const $=x=>document.getElementById(x);let p="",t=null,n=60;const norm=v=>{v=v.replace(/\D/g,"");if(v.startsWith("0"))v="62"+v.slice(1);if(!v.startsWith("62"))v="62"+v;return "+"+v};function msg(x,ok=false){$("s").textContent=x;$("s").className="status show "+(ok?"ok":"err")}function timer(){n=60;$("resend").disabled=true;$("resend").textContent="Kirim ulang OTP ("+n+")";clearInterval(t);t=setInterval(()=>{n--;$("resend").textContent=n?"Kirim ulang OTP ("+n+")":"Kirim ulang OTP";if(!n){clearInterval(t);$("resend").disabled=false}},1000)}
async function send(){p=norm($("phone").value);$("send").disabled=true;try{let r=await fetch("/api/auth/whatsapp/request-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:p})});let d=await r.json();if(!r.ok)throw Error(d.error||"Gagal mengirim OTP");$("otpbox").style.display="block";msg("OTP dikirim ke WhatsApp. Berlaku 5 menit.",true);timer();$("otp").focus()}catch(e){msg(e.message)}finally{$("send").disabled=false}}$("f").onsubmit=e=>{e.preventDefault();send()};$("verify").onclick=async()=>{let o=$("otp").value;if(!/^\d{6}$/.test(o))return msg("OTP harus 6 digit.");$("verify").disabled=true;try{let r=await fetch("/api/auth/whatsapp/verify-otp",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({phone:p,otp:o})});let d=await r.json();if(!r.ok)throw Error(d.error||"OTP salah");location.href=d.redirect||"/AnakAsuh.html"}catch(e){msg(e.message)}finally{$("verify").disabled=false}};$("resend").onclick=send;$("otp").oninput=()=>{$("otp").value=$("otp").value.replace(/\D/g,"").slice(0,6)}
</script></body></html>
